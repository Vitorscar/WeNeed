<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Enviar proposta · weneed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4F46E5">
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { padding: 24px 22px 80px; }
  
  /* Estado de Sucesso */
  .success-state { text-align: center; padding: 40px 4px; display: none; }
  .success-state.show { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .check-circle { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
  .check-circle svg { width: 32px; height: 32px; }
  .check-circle path { stroke: var(--accent-ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .success-state h3 { font-size: 1.2rem; margin: 0 0 8px; font-family: var(--font-display); }
  .success-state p { font-size: 0.88rem; color: var(--ink-soft); margin: 0 0 24px; line-height: 1.5; }

  /* Detalhes da Demanda */
  .demand-detail { background: var(--surface); border-radius: var(--radius-lg); padding: 22px 20px; margin-bottom: 14px; border: 1px solid var(--border); }
  .demand-detail h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0 0 8px; color: var(--ink); }
  .demand-detail p { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.6; margin: 0 0 16px; }
  .demand-meta { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.82rem; color: var(--ink-faint); margin-bottom: 16px; }
  .demand-images { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
  .demand-images img { width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer; flex-shrink: 0; }
  
  .detail-lines { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
  .detail-line { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; }
  .detail-line span:first-child { color: var(--ink-soft); }
  .detail-line span:last-child { font-weight: 600; color: var(--ink); text-align: right; }
</style>
</head>
<body>

<div class="container-mobile">
  <header class="header-dark">
    <div class="header-top">
      <div class="brand alert">Bizu<span>xo</span></div>
      <a class="pill-link" href="demandas-disponiveis.html">← Voltar</a>
    </div>
    <h2 id="demandTitle" style="font-size:1.1rem; margin:0;">Carregando...</h2>
  </header>

  <div class="wrap">
    <!-- 1. Detalhes da Demanda -->
    <div class="demand-detail" id="detailCard">
      <div id="demandContent">
        <p style="text-align:center; color:var(--ink-faint);">Buscando detalhes da demanda...</p>
      </div>
    </div>

    <!-- 2. Formulário de Proposta -->
    <form id="propostaForm">
      <div class="card">
        <div class="card-label alert"><span class="dot"></span>Sua proposta</div>
        
        <div class="field-row">
          <div class="field">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" placeholder="Ex: 150.00" min="1" step="0.01" required>
          </div>
          <div class="field">
            <label for="prazo">Prazo de entrega</label>
            <select id="prazo" required>
              <option value="">Selecione...</option>
              <option value="hoje">Ainda hoje</option>
              <option value="1h">Em 1 hora</option>
              <option value="2h">Em 2 horas</option>
              <option value="amanha">Amanhã</option>
              <option value="semana">Esta semana</option>
            </select>
          </div>
        </div>
        
        <div class="field">
          <label for="mensagem">Mensagem para o cliente</label>
          <textarea id="mensagem" rows="4" placeholder="Ex: Consigo ir aí amanhã às 14h. Já possuo todas as ferramentas necessárias..." required></textarea>
        </div>
      </div>
      
      <button type="submit" class="btn btn-alert" id="sendBtn" style="width:100%; margin-top:16px;">Enviar proposta</button>
      <div class="terms" style="font-size:0.75rem; color:var(--ink-faint); text-align:center; margin-top:14px;">
        O cliente será notificado e poderá aceitar ou recusar sua proposta.
      </div9>
    </form>

    <!-- 3. Estado de Sucesso -->
    <div class="success-state" id="successState">
      <div class="check-circle">
        <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>
      </div>
      <h3>Proposta enviada!</h3>
      <p>O cliente vai receber sua proposta e pode entrar em contato a qualquer momento pelo chat da plataforma.</p>
      <a class="btn btn-dark" href="dashboard-prestador.html" style="text-decoration:none;">Voltar ao Painel</a>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-cliente.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
   <script src="../app.js"></script>

<script>
  // Pega o ID da URL (suporta ?id= ou ?demand_id=)
  const urlParams = new URLSearchParams(window.location.search);
  const demandId = urlParams.get('id') || urlParams.get('demand_id');
  let providerProfileId = null;

  async function init() {
    if (!demandId) { 
      window.location.href = 'demandas-disponiveis.html'; 
      return; 
    }

    if (!window.supabaseClient) { 
      alert('Erro de configuração do sistema.'); 
      return; 
    }

    // 1. Verificar Autenticação e pegar o ID DO PERFIL (não do auth)
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (!session) { 
      window.location.href = '../index.html'; 
      return; 
    }

    const { data: profile, error: profileError } = await window.supabaseClient
      .from('profiles')
      .select('id')
      .eq('user_id', session.user.id)
      .single();

    if (profileError || !profile) {
      alert('Erro ao carregar seu perfil de prestador.');
      return;
    }
    providerProfileId = profile.id;

    // 2. Carregar detalhes da demanda
    carregarDemanda();
  }

  async function carregarDemanda() {
    const { data: demand, error } = await window.supabaseClient
      .from('demands')
      .select(`
        id, title, description, budget_min, budget_max, city, neighborhood, created_at, media_urls, status,
        categories(name, icon, service_type),
        profiles!demands_client_id_fkey(full_name)
      `)
      .eq('id', demandId)
      .single();

    if (error || !demand) {
      document.getElementById('demandContent').innerHTML = '<p style="text-align:center; color:var(--alert);">Demanda não encontrada.</p>';
      document.getElementById('propostaForm').style.display = 'none';
      return;
    }

    if (demand.status !== 'OPEN') {
      document.getElementById('demandContent').innerHTML = '<p style="text-align:center; color:var(--alert);">⚠️ Esta demanda não está mais aberta para propostas.</p>';
      document.getElementById('propostaForm').style.display = 'none';
      return;
    }

    // Formatar dados para exibição
    document.getElementById('demandTitle').textContent = demand.title;
    
    const isFreelance = demand.categories?.service_type === 'FREELANCE';
    const budget = demand.budget_max ? `R$ ${parseFloat(demand.budget_max).toFixed(2)}` : (demand.budget_min ? `A partir de R$ ${parseFloat(demand.budget_min).toFixed(2)}` : 'A combinar');
    const location = isFreelance ? '💻 Online' : `📍 ${demand.city || 'Não especificada'}${demand.neighborhood ? ' - ' + demand.neighborhood : ''}`;
    const date = new Date(demand.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
    const clientName = demand.profiles?.full_name ? demand.profiles.full_name.split(' ')[0] : 'Cliente';

    let imagesHtml = '';
    if (demand.media_urls && demand.media_urls.length > 0) {
      imagesHtml = `<div class="demand-images">${demand.media_urls.map(url => `<img src="${url}" alt="Foto" onclick="window.open('${url}')">`).join('')}</div>`;
    }

    document.getElementById('demandContent').innerHTML = `
      ${imagesHtml}
      <p style="font-size:0.9rem; line-height:1.6; color:var(--ink); margin-bottom:16px;">"${demand.description}"</p>
      
      <div class="detail-lines">
        <div class="detail-line"><span>Categoria</span><span>${demand.categories?.icon || '📌'} ${demand.categories?.name || 'Serviço'}</span></div>
        <div class="detail-line"><span>Local</span><span>${location}</span></div>
        <div class="detail-line"><span>Orçamento</span><span style="color:var(--accent-ink); font-weight:700;">${budget}</span></div>
        <div class="detail-line"><span>Cliente</span><span>${clientName}</span></div>
        <div class="detail-line"><span>Publicada</span><span>${date}</span></div>
      </div>
    `;
  }

  // Envio do Formulário
  document.getElementById('propostaForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const valor = parseFloat(document.getElementById('valor').value);
    const prazoSelect = document.getElementById('prazo').value;
    const mensagem = document.getElementById('mensagem').value.trim();

    if (!valor || valor <= 0) { alert('Informe um valor válido.'); return; }
    if (!prazoSelect) { alert('Selecione um prazo.'); return; }
    if (!mensagem) { alert('Escreva uma mensagem para o cliente.'); return; }

    // Mapear o select de prazo para dias (inteiro) conforme o banco de dados
    let deadlineDays = 1;
    let prazoTexto = '';
    switch(prazoSelect) {
      case 'hoje': deadlineDays = 0; prazoTexto = 'Ainda hoje'; break;
      case '1h': deadlineDays = 0; prazoTexto = '1 hora'; break;
      case '2h': deadlineDays = 0; prazoTexto = '2 horas'; break;
      case 'amanha': deadlineDays = 1; prazoTexto = 'Amanhã'; break;
      case 'semana': deadlineDays = 7; prazoTexto = 'Esta semana'; break;
      default: deadlineDays = 1; prazoTexto = prazoSelect;
    }

    const btn = document.getElementById('sendBtn');
    btn.textContent = 'Enviando...';
    btn.disabled = true;

    try {
      // Inserir proposta no banco
      const { error } = await window.supabaseClient
        .from('proposals')
        .insert({
          demand_id: demandId,
          provider_id: providerProfileId, // ✅ USANDO O ID DO PERFIL (CORRETO)
          price: valor,
          deadline_days: deadlineDays,
          message: `[Prazo: ${prazoTexto}]\n\n${mensagem}`, // Salva o prazo junto com a mensagem para contexto
          status: 'pendente'
        });

      if (error) {
        if (error.code === '23505') {
          throw new Error('Você já enviou uma proposta para esta demanda.');
        }
        throw error;
      }

      // Transição suave para a tela de sucesso
      document.getElementById('detailCard').style.display = 'none';
      document.getElementById('propostaForm').style.display = 'none';
      document.getElementById('successState').classList.add('show');
      
      // Opcional: Esconder o header de "Voltar" para forçar o uso do botão do sucesso
      document.querySelector('.pill-link').style.display = 'none';

    } catch (err) {
      console.error('Erro ao enviar proposta:', err);
      alert('❌ Erro: ' + err.message);
      btn.textContent = 'Enviar proposta';
      btn.disabled = false;
    }
  });

  init();
</script>
</body>
</html>
