<style>
  /* ---------- BLINDAGEM LOCAL ---------- */
  @media (max-width:1023px){
    .sidebar{ display:none !important; }
    .app-shell{ display:block !important; }
  }
  @media (min-width:1024px){
    .mobile-nav{ display:none !important; }
  }

  /* ---------- ICON SYSTEM ---------- */
  .icon{ width:16px;height:16px;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0;display:block; }
  .icon-sm{ width:14px;height:14px;stroke-width:2; }
  .icon-md{ width:18px;height:18px;stroke-width:1.75; }
  .icon-lg{ width:22px;height:22px;stroke-width:1.5; }

  /* ---------- MAIN ---------- */
  .main-content{ padding:var(--space-4) var(--space-4) var(--space-6); }

  /* ---------- PAGE INTRO ---------- */
  .intro{ margin-bottom:var(--space-4); }
  .intro h1{ font-size:var(--font-size-xl); font-weight:var(--font-weight-extrabold); letter-spacing:var(--tracking-tighter); line-height:var(--line-height-snug); margin:0 0 2px; }
  .intro p{ font-size:var(--font-size-sm); color:var(--text-secondary); margin:0; line-height:var(--line-height-normal); }

  /* ---------- TOOLBAR ---------- */
  .toolbar{ margin:0 0 var(--space-3); }
  .search-input{ background:var(--surface-default); }

  /* ---------- FILTER BAR ---------- */
  .filter-bar{ display:flex; gap:var(--space-2); margin-bottom:var(--space-4); flex-wrap:wrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .filter-bar::-webkit-scrollbar{ display:none; }
  .filter-chip{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; font-size:var(--font-size-sm); font-weight:var(--font-weight-semibold); color:var(--text-secondary); background:var(--surface-default); border:1.5px solid var(--border-default); border-radius:var(--radius-full); cursor:pointer; user-select:none; line-height:1.2; white-space:nowrap; flex-shrink:0; transition:background var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out); -webkit-tap-highlight-color:transparent; }
  .filter-chip:hover{ border-color:var(--color-brand-blue-deep); color:var(--color-brand-blue-deep); }
  .filter-chip.active{ background:var(--color-brand-blue-deep); color:var(--color-white); border-color:var(--color-brand-blue-deep); }
  .filter-chip.active:hover{ color:var(--color-white); }

  /* ---------- RESULTS COUNT ---------- */
  .results-count{ font-size:var(--font-size-xs); color:var(--text-secondary); margin:0 0 var(--space-3); font-weight:var(--font-weight-medium); }

  /* ---------- DEMAND CARDS ---------- */
  .demand-card{ position:relative; display:block; background:var(--surface-default); border:1px solid var(--border-default); border-radius:var(--radius-md); padding:var(--space-4); margin-bottom:var(--space-3); color:inherit; text-decoration:none; cursor:pointer; transition:box-shadow var(--duration-base) var(--ease-out), border-color var(--duration-base) var(--ease-out), transform var(--duration-base) var(--ease-out); }
  .demand-card:hover{ box-shadow:var(--shadow-md); border-color:var(--color-gray-300); }
  .demand-card:active{ transform:scale(0.995); }
  .demand-card.has-proposal{ border-left:3px solid var(--color-brand-blue-deep); }

  .demand-card-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:var(--space-3); margin-bottom:var(--space-3); }
  .demand-card-title{ flex:1; font-size:var(--font-size-base); font-weight:var(--font-weight-bold); color:var(--text-primary); letter-spacing:var(--tracking-tight); line-height:var(--line-height-snug); margin:0; word-break:break-word; }

  .demand-card-badges{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex-shrink:0; }
  .demand-card-badge{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:var(--font-weight-bold); letter-spacing:var(--tracking-wider); text-transform:uppercase; padding:5px 10px; border-radius:var(--radius-full); white-space:nowrap; background:var(--color-gray-100); color:var(--color-gray-700); }
  .demand-card-badge .icon{ width:12px;height:12px;stroke-width:2; }
  .demand-card-badge.freelance{ background:rgba(0,87,255,.10); color:var(--color-brand-blue-deep); }
  .demand-card-badge.proposed{ background:var(--color-black); color:var(--color-white); }

  .demand-card-images{ display:flex; gap:var(--space-2); margin-bottom:var(--space-3); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .demand-card-images::-webkit-scrollbar{ display:none; }
  .demand-card-images img{ width:56px; height:56px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--border-default); flex-shrink:0; }

  .demand-card-desc{ font-size:var(--font-size-sm); color:var(--text-secondary); line-height:var(--line-height-normal); margin:0 0 var(--space-3); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  .demand-card-footer{ display:flex; flex-direction:column; gap:var(--space-3); }
  .demand-card-meta{ display:flex; flex-wrap:wrap; gap:var(--space-3); font-size:var(--font-size-xs); color:var(--text-secondary); line-height:var(--line-height-normal); }
  .demand-card-meta span{ display:inline-flex; align-items:center; gap:4px; }
  .demand-card-meta .icon{ width:12px;height:12px;stroke-width:2; }
  .demand-card-budget{ font-weight:var(--font-weight-bold); font-size:var(--font-size-base); color:var(--color-brand-blue-deep); letter-spacing:var(--tracking-tight); font-variant-numeric:tabular-nums; }

  /* ---------- EMPTY STATE ---------- */
  .empty-state{ text-align:center; padding:var(--space-6) var(--space-4); background:var(--surface-default); border:1px dashed var(--border-default); border-radius:var(--radius-md); color:var(--text-secondary); }
  .empty-state .empty-icon{ display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; border-radius:50%; background:var(--surface-subtle); color:var(--color-gray-400); margin:0 auto var(--space-3); }
  .empty-state .empty-icon .icon{ width:26px;height:26px;stroke-width:1.5; }
  .empty-state h3{ font-size:var(--font-size-base); font-weight:var(--font-weight-bold); color:var(--text-primary); margin:0 0 var(--space-2); letter-spacing:var(--tracking-tight); }
  .empty-state p{ font-size:var(--font-size-sm); line-height:var(--line-height-normal); margin:0 auto; max-width:40ch; }

  /* ---------- LOADING ---------- */
  .loading-block{ display:flex; align-items:center; justify-content:center; gap:var(--space-3); padding:var(--space-10); color:var(--text-secondary); font-size:var(--font-size-sm); font-weight:var(--font-weight-medium); }
  .loading-block::after{ content:''; display:inline-block; width:20px; height:20px; border:2.5px solid var(--color-gray-200); border-top-color:var(--color-brand-blue-deep); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- TOAST ---------- */
  .toast-container{ position:fixed; bottom:90px; right:24px; left:24px; z-index:var(--z-toast); display:flex; flex-direction:column; gap:var(--space-2); pointer-events:none; align-items:flex-end; }
  .toast{ background:var(--color-black); color:var(--color-white); padding:var(--space-3) var(--space-5); border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:var(--space-3); font-size:var(--font-size-sm); font-weight:var(--font-weight-medium); animation:slideIn .35s cubic-bezier(.16,1,.3,1) forwards; min-width:260px; max-width:380px; border-left:4px solid var(--color-brand-blue); pointer-events:auto; }
  .toast.success{ border-left-color:var(--color-success); }
  .toast.error{ border-left-color:var(--color-error); }
  .toast .icon{ width:16px;height:16px;stroke-width:2.25; }
  @keyframes slideIn{ from{ transform:translateX(120%); opacity:0; } to{ transform:translateX(0); opacity:1; } }
  @keyframes slideOut{ from{ transform:translateX(0); opacity:1; } to{ transform:translateX(120%); opacity:0; } }

  /* ---------- MOBILE NAV ---------- */
  .mobile-nav{ display:none; }
  @media (max-width:1023px){
    .mobile-nav{ display:grid !important; grid-template-columns:repeat(5, 1fr); position:fixed; bottom:0; left:0; right:0; height:var(--app-mobile-nav-height); background:var(--surface-default); border-top:1px solid var(--border-default); align-items:stretch; z-index:var(--z-sticky); padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -4px 20px rgba(10,10,10,.05); isolation:isolate; }
    .mobile-nav-item{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; color:var(--color-gray-400); font-size:11px; font-weight:var(--font-weight-semibold); height:100%; position:relative; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; transition:color var(--duration-base) var(--ease-out), transform var(--duration-fast) var(--ease-out); }
    .mobile-nav-item:active{ transform:scale(0.88); }
    .mobile-nav-item.active{ color:var(--color-brand-blue-deep); }
    .mobile-nav-item.active::before{ content:''; position:absolute; top:6px; left:50%; transform:translateX(-50%); width:5px; height:5px; background:var(--color-brand-blue); border-radius:50%; }
  }

  /* ---------- TABLET ---------- */
  @media (min-width:640px){
    .main-content{ padding:var(--space-5) var(--space-6) var(--space-8); }
    .demand-card-footer{ flex-direction:row; justify-content:space-between; align-items:center; }
    .demand-card-meta{ flex:1; }
    .toast-container{ right:16px; left:auto; }
  }

  /* ---------- DESKTOP ---------- */
  @media (min-width:1024px){
    .main-content{ padding:var(--space-6) var(--space-8) var(--space-12); }
    .intro h1{ font-size:var(--font-size-2xl); }
    .nav-item.active{ background:rgba(0,87,255,.14); border-left:2px solid var(--color-brand-blue); }
  }
</style>

<script>
  /* ==========================================
     CONSTANTES
     ========================================== */
  const OPEN_STATUSES = ['OPEN', 'ABERTA', 'EM_PROPOSTAS'];
  const DEMANDS_LIMIT = 100;
  const REALTIME_DEBOUNCE_MS = 800;

  /* ==========================================
     ESTADO
     ========================================== */
  let providerProfileId = null;
  let providerCategoryIds = [];
  let allDemands = [];
  let proposedDemandIds = new Set();
  let currentCategoryFilter = 'TODAS';
  let searchTerm = '';
  let realtimeTimer = null;
  let loading = true;

  /* ==========================================
     HELPERS
     ========================================== */
  function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>'"]/g, tag => ({
      '&': '&amp;','<': '&lt;','>': '&gt;',"'": '&#39;','"': '&quot;'
    }[tag]));
  }

  /* Bloqueia javascript:, data: e outros esquemas perigosos */
  function safeUrl(url) {
    if (!url) return '';
    const s = String(url).trim();
    if (/^(javascript|data|vbscript):/i.test(s)) return '';
    if (!/^https?:\/\//i.test(s)) return '';
    return escapeHTML(s);
  }

  function formatarValor(v) {
    if (v === null || v === undefined || v === '') return '';
    const n = Number(v);
    if (isNaN(n)) return '';
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n);
  }

  function mostrarToast(mensagem, tipo = 'error') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = `toast ${tipo}`;
    const icon = tipo === 'success'
      ? `<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
      : `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>`;
    toast.innerHTML = `${icon}<span>${escapeHTML(mensagem)}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'slideOut .3s ease forwards';
      setTimeout(() => toast.remove(), 300);
    }, 3200);
  }

  /* ==========================================
     INIT
     ========================================== */
  async function init() {
    const supabase = window.supabaseClient;
    if (!supabase) {
      setTimeout(() => window.location.reload(), 800);
      return;
    }

    const { data: { session }, error: sessionError } = await supabase.auth.getSession();
    if (sessionError || !session) {
      window.location.href = '../index.html';
      return;
    }

    /* Perfil do prestador */
    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('id, full_name, city, uf')
      .eq('user_id', session.user.id)
      .single();

    if (profileError || !profile) {
      console.error('Erro ao carregar perfil:', profileError);
      document.getElementById('userName').textContent = 'Olá, Profissional';
      document.getElementById('userLoc').textContent = 'Local não definido';
      mostrarToast('Não foi possível carregar seu perfil.', 'error');
      return;
    }

    providerProfileId = profile.id;

    document.getElementById('userName').textContent =
      `Olá, ${(profile.full_name || 'Profissional').split(' ')[0]}`;
    document.getElementById('userLoc').textContent = profile.city
      ? `${profile.city}${profile.uf ? ', ' + profile.uf : ''}`
      : 'Local não definido';

    /* Categorias do prestador (filtros) + propostas já enviadas */
    await Promise.all([
      carregarCategoriasPrestador(supabase),
      carregarPropostasEnviadas(supabase)
    ]);

    /* Demandas */
    await carregarDemandas(supabase);

    configurarEventListeners(supabase);
    configurarRealtime(supabase);
  }

  /* ==========================================
     CATEGORIAS DO PRESTADOR
     ========================================== */
  async function carregarCategoriasPrestador(supabase) {
    try {
      const { data: cats, error } = await supabase
        .from('provider_categories')
        .select('category_id, categories ( id, name, icon )')
        .eq('provider_id', providerProfileId);

      if (error) throw error;

      const valid = (cats || []).filter(c => c.categories && c.categories.id);
      providerCategoryIds = valid.map(c => c.category_id);
      renderizarFiltros(valid);
    } catch (err) {
      console.warn('Erro ao carregar categorias:', err);
      /* Filtros ficam só com "Todas" */
    }
  }

  /* ==========================================
     PROPOSTAS JÁ ENVIADAS
     ========================================== */
  async function carregarPropostasEnviadas(supabase) {
    try {
      const { data, error } = await supabase
        .from('proposals')
        .select('demand_id')
        .eq('provider_id', providerProfileId);

      if (error) throw error;
      proposedDemandIds = new Set((data || []).map(p => p.demand_id));
    } catch (err) {
      console.warn('Erro ao carregar propostas enviadas:', err);
    }
  }

  /* ==========================================
     CARREGAR DEMANDAS
     ========================================== */
  async function carregarDemandas(supabase) {
    loading = true;
    renderizar();

    try {
      const { data, error } = await supabase
        .from('demands')
        .select(`
          id, title, description, budget_min, budget_max, status, created_at,
          city, neighborhood, zip_code, media_urls,
          category_id, categories ( name, icon, service_type )
        `)
        .in('status', OPEN_STATUSES)
        .order('created_at', { ascending: false })
        .limit(DEMANDS_LIMIT);

      if (error) throw error;

      allDemands = data || [];
      loading = false;
      renderizar();

    } catch (err) {
      console.error('Erro ao buscar demandas:', err);
      loading = false;
      mostrarToast('Erro ao carregar demandas.', 'error');
      document.getElementById('demandasList').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
          </div>
          <h3>Não foi possível carregar</h3>
          <p>Tente novamente em instantes.</p>
        </div>`;
      document.getElementById('resultsCount').textContent = '';
    }
  }

  /* ==========================================
     FILTROS
     ========================================== */
  function renderizarFiltros(cats) {
    const bar = document.getElementById('filterBar');
    /* Limpa tudo, mantendo o chip "Todas" original */
    bar.innerHTML = `<span class="filter-chip active" data-cat="TODAS" role="button" tabindex="0">Todas</span>`;

    cats.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'filter-chip';
      chip.dataset.cat = c.category_id;
      chip.textContent = c.categories.name;
      chip.setAttribute('role', 'button');
      chip.setAttribute('tabindex', '0');
      bar.appendChild(chip);
    });
  }

  function aplicarFiltroCategoria(catId) {
    currentCategoryFilter = catId;
    document.querySelectorAll('#filterBar .filter-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.cat === catId);
    });
    renderizar();
  }

  /* ==========================================
     RENDER
     ========================================== */
  function renderizar() {
    const container = document.getElementById('demandasList');
    const countEl = document.getElementById('resultsCount');

    if (loading) {
      container.innerHTML = `<div class="loading-block">Carregando demandas...</div>`;
      countEl.textContent = '';
      return;
    }

    const filtered = allDemands.filter(d => {
      /* Filtro categoria */
      if (currentCategoryFilter !== 'TODAS' && d.category_id !== currentCategoryFilter) {
        return false;
      }
      /* Busca */
      if (searchTerm) {
        const haystack = `${d.title || ''} ${d.description || ''} ${d.city || ''} ${d.neighborhood || ''}`.toLowerCase();
        if (!haystack.includes(searchTerm)) return false;
      }
      return true;
    });

    countEl.textContent = filtered.length
      ? `${filtered.length} demanda${filtered.length !== 1 ? 's' : ''} disponíve${filtered.length !== 1 ? 'is' : 'l'}`
      : '';

    if (filtered.length === 0) {
      const isEmptyOverall = allDemands.length === 0;
      const isSearching = searchTerm.length > 0;
      const isFiltering = currentCategoryFilter !== 'TODAS';

      let title = 'Nenhuma demanda encontrada';
      let text = 'Novas demandas aparecerão aqui quando clientes publicarem.';

      if (isEmptyOverall) {
        title = 'Tudo em dia por aqui';
        text = 'Novas demandas aparecerão aqui assim que clientes publicarem.';
      } else if (isSearching) {
        title = 'Nada encontrado';
        text = 'Nenhuma demanda corresponde à sua busca.';
      } else if (isFiltering) {
        title = 'Nada nessa categoria';
        text = 'Tente outra categoria ou veja todas as demandas.';
      }

      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">
            <svg class="icon" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
          </div>
          <h3>${escapeHTML(title)}</h3>
          <p>${escapeHTML(text)}</p>
        </div>`;
      return;
    }

    container.innerHTML = filtered.map(d => renderDemandCard(d)).join('');
  }

  function renderDemandCard(d) {
    const isFreelance = d.categories?.service_type === 'FREELANCE';
    const jaEnviou = proposedDemandIds.has(d.id);

    const badgePresencialOuOnline = `
      <span class="demand-card-badge ${isFreelance ? 'freelance' : ''}">
        ${isFreelance
          ? `<svg class="icon" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>`
          : `<svg class="icon" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`}
        ${isFreelance ? 'Online' : 'Presencial'}
      </span>`;

    const badgeProposta = jaEnviou
      ? `<span class="demand-card-badge proposed">
           <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
           Proposta enviada
         </span>`
      : '';

    const budget = d.budget_max
      ? `Até ${formatarValor(d.budget_max)}`
      : (d.budget_min ? `A partir de ${formatarValor(d.budget_min)}` : 'A combinar');

    const date = d.created_at
      ? new Date(d.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })
      : '';

    const location = isFreelance
      ? 'Online'
      : (d.city
        ? `${d.city}${d.neighborhood ? ' · ' + d.neighborhood : ''}`
        : 'Local não definido');

    /* Imagens — só URLs http(s) válidas */
    let imagesHtml = '';
    if (Array.isArray(d.media_urls) && d.media_urls.length > 0) {
      const validUrls = d.media_urls.map(safeUrl).filter(Boolean).slice(0, 4);
      if (validUrls.length > 0) {
        imagesHtml = `
          <div class="demand-card-images">
            ${validUrls.map(url =>
              `<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`
            ).join('')}
          </div>`;
      }
    }

    const cardClass = `demand-card${jaEnviou ? ' has-proposal' : ''}`;

    return `
      <a href="enviar-proposta.html?demand_id=${encodeURIComponent(d.id)}" class="${cardClass}">
        <div class="demand-card-header">
          <h3 class="demand-card-title">${escapeHTML(d.title || 'Demanda')}</h3>
          <div class="demand-card-badges">
            ${badgePresencialOuOnline}
            ${badgeProposta}
          </div>
        </div>

        ${imagesHtml}

        <p class="demand-card-desc">${escapeHTML(d.description || '')}</p>

        <div class="demand-card-footer">
          <div class="demand-card-meta">
            <span>
              <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/>
              </svg>
              ${escapeHTML(d.categories?.name || 'Serviço')}
            </span>
            <span>
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              ${escapeHTML(location)}
            </span>
            ${date ? `
              <span>
                <svg class="icon" viewBox="0 0 24 24">
                  <rect width="18" height="18" x="3" y="4" rx="2"/>
                  <path d="M16 2v4M8 2v4M3 10h18"/>
                </svg>
                ${escapeHTML(date)}
              </span>` : ''}
          </div>
          <span class="demand-card-budget">${escapeHTML(budget)}</span>
        </div>
      </a>`;
  }

  /* ==========================================
     EVENT LISTENERS
     ========================================== */
  function configurarEventListeners(supabase) {
    /* Filtros por categoria */
    document.getElementById('filterBar').addEventListener('click', (e) => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      aplicarFiltroCategoria(chip.dataset.cat);
    });

    /* Busca com debounce */
    let searchTimer = null;
    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      const value = e.target.value.trim().toLowerCase();
      searchTimer = setTimeout(() => {
        searchTerm = value;
        renderizar();
      }, 180);
    });

    /* Logout */
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      try { await supabase.auth.signOut(); } catch (err) { console.warn(err); }
      window.location.href = '../index.html';
    });
  }

  /* ==========================================
     REALTIME (com debounce)
     ========================================== */
  function configurarRealtime(supabase) {
    supabase
      .channel('demandas-disponiveis-realtime')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'demands' },
        () => {
          clearTimeout(realtimeTimer);
          realtimeTimer = setTimeout(() => carregarDemandas(supabase), REALTIME_DEBOUNCE_MS);
        }
      )
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'proposals', filter: `provider_id=eq.${providerProfileId}` },
        () => {
          /* Atualiza o badge "proposta enviada" quando o prestador propõe em outra aba */
          carregarPropostasEnviadas(supabase).then(() => renderizar());
        }
      )
      .subscribe();
  }

  init();
</script>
</body>
