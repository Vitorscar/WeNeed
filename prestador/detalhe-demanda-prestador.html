<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar proposta · weneed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4F46E5">
<link rel="stylesheet" href="../style.css">
<style>
  .wrap{ padding:24px 22px 60px; }
  .success-state{ text-align:center; padding:20px 4px 4px; display:none; }
  .success-state.show{ display:block; }
  .check-circle{ width:56px; height:56px; border-radius:50%; background:var(--accent-soft); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; }
  .check-circle svg{ width:26px; height:26px; }
  .check-circle path{ stroke:var(--accent-ink); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .success-state h3{ font-size:1.1rem; margin:0 0 6px; }
  .success-state p{ font-size:0.85rem; color:var(--ink-soft); margin:0 0 20px; }
</style>
</head>
<body>

<div class="container-mobile">
  <header class="header-dark">
    <div class="header-top">
      <div class="brand alert">Bizu<span>xo</span></div>
      <a class="pill-link" href="demandas-disponiveis.html">← Voltar</a>
    </div>
    <h2 id="demandTitle" style="font-size:1.1rem; margin:0;">Carregando demanda...</h2>
  </header>

  <div class="wrap">
    <div class="card" id="detailCard">
      <div class="card-label alert"><span class="dot"></span>Detalhes da demanda</div>
      <div class="detail-lines" id="detailLines"></div>
      <p id="demandDesc" style="font-size:0.85rem; color:var(--ink-soft); line-height:1.5; margin:16px 0 0;"></p>
    </div>

    <form id="propostaForm">
      <div class="card">
        <div class="card-label alert"><span class="dot"></span>Sua proposta</div>
        <div class="field-row">
          <div class="field">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" placeholder="120" min="1" step="0.01" required>
          </div>
          <div class="field">
            <label for="prazo">Prazo</label>
            <!-- ✅ deadline_days é INTEGER — value agora é número de dias -->
            <select id="prazo" required>
              <option value="">Selecione...</option>
              <option value="1">Amanhã (1 dia)</option>
              <option value="2">Em 2 dias</option>
              <option value="3">Em 3 dias</option>
              <option value="7">Em 1 semana</option>
              <option value="15">Em 2 semanas</option>
              <option value="30">Em 1 mês</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="mensagem">Mensagem para o cliente</label>
          <textarea id="mensagem" placeholder="Ex: Consigo ir aí amanhã às 14h, já levo o material necessário..." required></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-alert" id="sendBtn">Enviar proposta</button>
    </form>

    <div class="success-state" id="successState">
      <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
      <h3>Proposta enviada!</h3>
      <p>O cliente vai receber sua proposta e pode entrar em contato a qualquer momento.</p>
      <a class="btn btn-dark" href="minhas-propostas.html">Ver minhas propostas</a>
    </div>
  </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-cliente.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/cadastro.js"></script>
<script src="../js/auth.js"></script>
<script src="../app.js"></script>

<script>
  // ==========================================
  // 0. SETUP
  // ==========================================
  const db = window.supabaseClient;
  const urlParams = new URLSearchParams(window.location.search);
  const demandId  = urlParams.get('id');

  let providerProfileId = null;

  // ==========================================
  // 1. CARREGA DEMANDA + PERFIL DO PRESTADOR
  // ==========================================
  async function init() {
    if (!db) { console.error('❌ supabaseClient não inicializado'); return; }
    if (!demandId) { window.location.href = 'demandas-disponiveis.html'; return; }

    // ---- 1.1 Sessão e perfil (precisamos do profile.id, não do user.id) ----
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = '../index.html'; return; }

    const { data: profile, error: profErr } = await db
      .from('profiles')
      .select('id')
      .eq('user_id', session.user.id)
      .single();

    if (profErr || !profile) {
      console.error('Erro perfil:', profErr);
      alert('Perfil de prestador não encontrado.');
      return;
    }
    providerProfileId = profile.id;

    // ---- 1.2 Buscar a demanda (SEM join — mais seguro) ----
    const { data, error } = await db
      .from('demands')
      .select('id, title, description, city, neighborhood, status, created_at, category_id')
      .eq('id', demandId)
      .single();

    if (error || !data) {
      console.error('Erro ao carregar demanda:', error);
      alert('Demanda não encontrada.');
      window.location.href = 'demandas-disponiveis.html';
      return;
    }

    // ---- 1.3 Tentar pegar o nome da categoria (join opcional) ----
   let categoriaNome = '—';
let categoriaIcon = '';
if (data.category_id) {
  const { data: cat } = await db
    .from('categories')
    .select('name, icon')
    .eq('id', data.category_id)
    .maybeSingle();

  if (cat) {
    categoriaNome = cat.name || '—';
    categoriaIcon = cat.icon || '';
  }

      } else {
        // Fallback: tenta 'categories' (alguns projetos usam esse nome)
        const { data: cat2 } = await db
          .from('categories')
          .select('name')
          .eq('id', data.category_id)
          .maybeSingle();
        if (cat2?.name) categoriaNome = cat2.name;
      }
    }

    // ---- 1.4 Contar propostas existentes ----
    const { count: propostasCount } = await db
      .from('proposals')
      .select('id', { count: 'exact', head: true })
      .eq('demand_id', demandId);

    // ---- 1.5 Preencher DOM ----
    document.getElementById('demandTitle').textContent = data.title || 'Demanda';
    document.getElementById('demandDesc').textContent  = data.description ? `"${data.description}"` : '';

    const dataPub = data.created_at
      ? new Date(data.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })
      : '—';

    document.getElementById('detailLines').innerHTML = `
      <div class="detail-line">
  <span>Categoria</span>
  <span>${categoriaIcon ? categoriaIcon + ' ' : ''}${categoriaNome}</span>
</div>
      <div class="detail-line"><span>Local</span><span>${data.neighborhood || '—'}, ${data.city || '—'}</span></div>
      <div class="detail-line"><span>Publicada</span><span>${dataPub}</span></div>
      <div class="detail-line"><span>Propostas até agora</span><span>${propostasCount || 0}</span></div>
    `;
  

  // ==========================================
  // 2. ENVIO DA PROPOSTA
  // ==========================================
  document.getElementById('propostaForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!providerProfileId) {
      alert('Sessão expirada. Faça login novamente.');
      window.location.href = '../index.html';
      return;
    }

    const btn = document.getElementById('sendBtn');
    btn.textContent = 'Enviando...';
    btn.disabled = true;

    // ✅ Colunas reais de proposals: demand_id, provider_id, price, deadline_days, message, status
    const payload = {
      demand_id:     demandId,                                              // UUID direto
      provider_id:   providerProfileId,                                     // profile.id
      price:         parseFloat(document.getElementById('valor').value),    // numeric
      deadline_days: parseInt(document.getElementById('prazo').value, 10),  // INTEGER
      message:       document.getElementById('mensagem').value.trim(),
      status:        'pendente'
    };

    const { error: insertError } = await db.from('proposals').insert(payload);

    if (insertError) {
      console.error('Erro insert:', insertError);
      alert('Erro ao enviar: ' + insertError.message);
      btn.textContent = 'Enviar proposta';
      btn.disabled = false;
      return;
    }

    // Atualiza status da demanda
    await db
      .from('demands')
      .update({ status: 'EM_PROPOSTAS' })
      .eq('id', demandId);

    document.getElementById('detailCard').style.display   = 'none';
    document.getElementById('propostaForm').style.display = 'none';
    document.getElementById('successState').classList.add('show');
  });

  init();
</script>
</body>
</html>
