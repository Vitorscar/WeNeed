<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar serviço · weneed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4F46E5">
<link rel="stylesheet" href="../style.css">
<style>
  .confirm-card{ width:100%; max-width:400px; background:var(--surface); border-radius:var(--radius-lg); box-shadow:0 2px 24px rgba(16,17,19,0.08); padding:30px 26px 26px; }
  .code-display { background: var(--surface-soft); border: 2px dashed var(--accent); border-radius: var(--radius-md); padding: 16px; text-align: center; margin: 16px 0; }
  .code-display .label { font-size: 0.78rem; color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .code-display .value { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--accent-ink); letter-spacing: 0.1em; margin-top: 4px; }
  .code-input { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
  .code-input input { width: 50px; height: 60px; text-align: center; font-size: 1.5rem; font-weight: 700; border: 2px solid var(--border); border-radius: var(--radius-sm); }
  .code-input input:focus { border-color: var(--accent); outline: none; }
  .action-row { display: flex; gap: 10px; margin-top: 16px; }
  .action-row .btn { flex: 1; font-size: 0.82rem; }
</style>
</head>
<body>

<div class="container-card" style="padding: 20px;">
  <div class="confirm-card text-center" id="cardContent">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">🔒</div>
    <div class="eyebrow" style="font-size:0.78rem; font-weight:700; color:var(--accent-ink); margin-bottom:8px;">Segurança weneed</div>
    <h1 style="font-size:1.35rem; font-weight:700; margin:0 0 6px;">Carregando ordem...</h1>
  </div>
</div>

<script type="module">
  import { confirmarFinalizacao, regenerarCodigo, reportarDisputa } from '../js/pagamentos.js';

  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('order_id');

  if (!orderId) { window.location.href = 'servicos-contratados.html'; }

  let orderData = null;

  async function carregarOrdem() {
    const { data: order, error } = await supabase
      .from('ordens_servico')
      .select('*, demands(titulo, cidade), profiles!ordens_servico_provider_id_fkey(nome)')
      .eq('id', orderId)
      .single();

    if (error || !order) {
      document.getElementById('cardContent').innerHTML = `<h3>Ordem não encontrada</h3><a class="btn btn-dark" href="servicos-contratados.html">Voltar</a>`;
      return;
    }
    orderData = order;
    renderizarTela();
  }

  function renderizarTela() {
    const card = document.getElementById('cardContent');
    const valorFmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(orderData.valor_total);
    
    let html = `
      <div class="eyebrow">Ordem de Serviço #${orderData.id.slice(0,4)}</div>
      <h1>${escapeHTML(orderData.demands.titulo)}</h1>
      <div class="greeting" style="font-size:0.88rem; color:var(--ink-soft); margin-bottom:22px; line-height:1.5;">
        Prestador: <b>${escapeHTML(orderData.profiles.nome)}</b><br>
        Valor retido: <b>${valorFmt}</b>
      </div>
      <div class="detail-lines" style="text-align:left; margin-bottom: 20px;">
        <div class="detail-line"><span>Status atual</span><span style="text-transform:capitalize; font-weight:600;">${orderData.status.replace('_', ' ')}</span></div>
      </div>
    `;

    // Lógica de Estados da Tela
    if (orderData.status === 'pago_aguardando_inicio') {
      html += `
        <div class="code-display">
          <div class="label">Código de Início do Serviço</div>
          <div class="value">${orderData.codigo_inicio || '----'}</div>
        </div>
        <p style="font-size:0.82rem; color:var(--ink-soft); margin-bottom:16px;">
          Informe este código ao prestador quando ele chegar. <b>Não inicie o serviço sem isso.</b>
        </p>
        <button class="btn btn-ghost" style="width:100%; font-size:0.8rem;" onclick="regenerar('inicio')">
          ↻ Não recebi / Perdi o código
        </button>
      `;
    } else if (orderData.status === 'aguardando_confirmacao_fim') {
      html += `
        <div class="code-display" style="border-color: var(--amber); background: var(--amber-soft);">
          <div class="label" style="color: var(--amber);">Prestador solicitou finalização</div>
        </div>
        <p style="font-size:0.85rem; color:var(--ink); margin:12px 0;">
          O prestador informou que terminou. Digite abaixo o <b>Código de Fim</b> que ele deve te passar:
        </p>
        <div class="code-input">
          <input type="text" maxlength="1" class="code-digit" oninput="moverFoco(this, 1)">
          <input type="text" maxlength="1" class="code-digit" oninput="moverFoco(this, 2)">
          <input type="text" maxlength="1" class="code-digit" oninput="moverFoco(this, 3)">
          <input type="text" maxlength="1" class="code-digit" oninput="moverFoco(this, 4)">
        </div>
        <button class="btn btn-accent" style="width:100%; margin-top:12px;" onclick="confirmarFim()">
          Confirmar Conclusão e Liberar Pagamento
        </button>
        <div class="action-row">
          <button class="btn btn-ghost" onclick="regenerar('fim')">↻ Reenviar código</button>
          <button class="btn btn-outline" style="color:var(--alert); border-color:var(--alert);" onclick="reportar()">⚠️ Reportar problema</button>
        </div>
      `;
    } else if (orderData.status === 'finalizado') {
      html += `<div class="check-circle" style="margin: 0 auto 16px;"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
               <h3>Serviço Concluído!</h3><p>O pagamento foi liberado ao prestador.</p>
               <a class="btn btn-dark" href="servicos-contratados.html" style="margin-top:16px; display:inline-block;">Voltar</a>`;
    } else {
      html += `<p style="color:var(--ink-soft);">Aguardando atualização do status do serviço.</p>
               <a class="btn btn-dark" href="servicos-contratados.html" style="margin-top:16px; display:inline-block;">Voltar</a>`;
    }

    card.innerHTML = html;
    
    // Adicionar listeners para os inputs de código se existirem
    if (orderData.status === 'aguardando_confirmacao_fim') {
      document.querySelectorAll('.code-digit').forEach((input, index) => {
        input.addEventListener('input', (e) => {
          if (e.target.value.length === 1 && index < 3) {
            document.querySelectorAll('.code-digit')[index + 1].focus();
          }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
            document.querySelectorAll('.code-digit')[index - 1].focus();
          }
        });
      });
    }
  }

  window.confirmarFim = async function() {
    const inputs = document.querySelectorAll('.code-digit');
    const codigo = Array.from(inputs).map(i => i.value).join('');
    
    if (codigo.length !== 4) {
      alert('Digite os 4 dígitos do código de fim.');
      return;
    }

    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
      await confirmarFinalizacao(orderId, codigo);
      alert('Serviço confirmado com sucesso! O pagamento foi liberado.');
      carregarOrdem(); // Recarrega para mostrar o estado finalizado
    } catch (err) {
      alert('Código incorreto ou erro no sistema: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Confirmar Conclusão e Liberar Pagamento';
      inputs.forEach(i => i.value = '');
      inputs[0].focus();
    }
  };

  window.regenerar = async function(tipo) {
    if(!confirm(`Deseja gerar um novo código de ${tipo === 'inicio' ? 'início' : 'fim'}? O anterior será invalidado.`)) return;
    try {
      const res = await regenerarCodigo(orderId, tipo);
      alert(`Novo código gerado: ${res.novo_codigo}`);
      carregarOrdem();
    } catch (err) {
      alert('Erro ao regenerar: ' + err.message);
    }
  };

  window.reportar = async function() {
    const motivo = prompt('Descreva brevemente o problema (ex: prestador não apareceu, serviço mal feito):');
    if (!motivo) return;
    
    try {
      await reportarDisputa(orderId, motivo);
      alert('Disputa registrada. Nossa equipe irá analisar e entrar em contato.');
      carregarOrdem();
    } catch (err) {
      alert('Erro ao reportar: ' + err.message);
    }
  };

  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
  }

  carregarOrdem();
</script>
</body>
</html>
