<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pagamento Pix · WENEED</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="stylesheet" href="../style.css">

<style>
  .icon{ width:16px;height:16px;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0;display:block; }
  .icon-sm{ width:14px;height:14px;stroke-width:2; }
  .icon-lg{ width:22px;height:22px;stroke-width:1.5; }
  .icon-xl{ width:28px;height:28px;stroke-width:1.5; }

  .wrap{ padding:var(--space-4) var(--space-5) var(--space-10); }

  .card-label .dot{ background:var(--color-brand-blue) !important; }

  .service-summary{
    display:flex; align-items:flex-start; gap:var(--space-3);
    padding-bottom:var(--space-4); margin-bottom:var(--space-4);
    border-bottom:1px solid var(--border-subtle);
  }
  .service-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:44px; height:44px; border-radius:var(--radius-sm);
    background:var(--color-gray-50); color:var(--color-gray-700); flex-shrink:0;
  }
  .service-icon .icon{ width:20px;height:20px; }
  .service-info{ flex:1; min-width:0; }
  .service-info h3{
    font-size:var(--font-size-base); font-weight:var(--font-weight-bold);
    letter-spacing:var(--tracking-tight); margin:0 0 2px; line-height:var(--line-height-snug);
  }
  .service-info .provider{
    font-size:var(--font-size-sm); color:var(--text-secondary);
    display:inline-flex; align-items:center; gap:6px;
  }
  .service-info .provider .icon{ width:12px;height:12px;stroke-width:2; }

  .detail-lines{ display:flex; flex-direction:column; gap:var(--space-2); }
  .detail-line{
    display:flex; justify-content:space-between; align-items:center; gap:var(--space-3);
    font-size:var(--font-size-sm); line-height:var(--line-height-normal);
  }
  .detail-line span:first-child{ color:var(--text-secondary); }
  .detail-line span:last-child{
    font-weight:var(--font-weight-semibold); color:var(--text-primary);
    text-align:right; font-variant-numeric:tabular-nums;
  }
  .detail-line.total{
    padding-top:var(--space-3); margin-top:var(--space-1);
    border-top:1px solid var(--border-default);
  }
  .detail-line.total span:last-child{
    font-size:var(--font-size-xl); font-weight:var(--font-weight-extrabold);
    letter-spacing:var(--tracking-tighter);
  }

  .qr-block{
    display:flex; flex-direction:column; align-items:center;
    gap:var(--space-4); padding:var(--space-5) 0;
  }
  .qr-image{
    width:220px; height:220px; background:var(--surface-default);
    border-radius:var(--radius-md); border:1px solid var(--border-default);
    display:flex; align-items:center; justify-content:center; padding:12px;
  }
  .qr-image img{ width:100%; height:100%; object-fit:contain; }

  .qr-code-text{
    width:100%; padding:var(--space-3) var(--space-4);
    background:var(--surface-subtle); border-radius:var(--radius-sm);
    font-family:monospace; font-size:11px; word-break:break-all;
    color:var(--text-primary); line-height:var(--line-height-normal);
    border:1px solid var(--border-default);
    max-height:80px; overflow-y:auto;
  }

  .copy-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px 20px; background:var(--color-black);
    color:var(--color-white); border:none; border-radius:var(--radius-sm);
    font-weight:var(--font-weight-bold); font-size:var(--font-size-sm);
    letter-spacing:var(--tracking-wide); text-transform:uppercase; cursor:pointer;
    transition:background var(--duration-fast);
  }
  .copy-btn:hover{ background:var(--color-gray-900); }
  .copy-btn.copied{ background:var(--color-success); }
  .copy-btn .icon{ width:14px;height:14px;stroke-width:2.25; }

  .countdown{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:var(--space-3); background:rgba(247,144,9,.08);
    border:1px solid rgba(247,144,9,.30); border-radius:var(--radius-sm);
    font-size:var(--font-size-sm); font-weight:var(--font-weight-semibold);
    color:var(--text-primary); margin-bottom:var(--space-4);
  }
  .countdown .icon{ color:var(--color-warning); }
  .countdown b{ font-variant-numeric:tabular-nums; color:var(--color-warning); }

  .security-notice{
    display:flex; gap:var(--space-3); padding:var(--space-3) var(--space-4);
    background:var(--surface-subtle); border-radius:var(--radius-sm);
    border-left:3px solid var(--color-brand-blue); margin-top:var(--space-3);
  }
  .security-notice .icon{ color:var(--color-brand-blue); flex-shrink:0; margin-top:2px; }
  .security-notice b{ display:block; color:var(--text-primary); font-weight:600; font-size:var(--font-size-xs); margin-bottom:2px; }
  .security-notice span{ font-size:var(--font-size-xs); color:var(--text-secondary); line-height:var(--line-height-normal); }

  .success-state{ text-align:center; padding:var(--space-8) var(--space-4); display:none; }
  .success-state.show{ display:block; animation:fadeIn var(--duration-slow) var(--ease-out); }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  .check-circle{
    width:64px; height:64px; border-radius:50%;
    background:rgba(18,183,106,.10); color:var(--color-success);
    margin:0 auto var(--space-5); display:flex; align-items:center; justify-content:center;
  }
  .check-circle .icon{ width:30px;height:30px;stroke-width:2.5; }
  .success-state h3{
    font-size:var(--font-size-xl); font-weight:var(--font-weight-extrabold);
    letter-spacing:var(--tracking-tight); margin:0 0 var(--space-2);
  }
  .success-state p{
    font-size:var(--font-size-sm); color:var(--text-secondary);
    line-height:var(--line-height-normal); margin:0 0 var(--space-5);
    max-width:40ch; margin-left:auto; margin-right:auto;
  }

  .loading-spinner{
    display:flex; align-items:center; justify-content:center; gap:var(--space-3);
    padding:var(--space-10); color:var(--text-secondary); font-size:var(--font-size-sm);
  }
  .loading-spinner::after{
    content:''; width:20px; height:20px;
    border:2.5px solid var(--color-gray-200); border-top-color:var(--color-brand-blue-deep);
    border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .error-state{
    text-align:center; padding:var(--space-8) var(--space-4);
  }
  .error-state .error-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:56px; height:56px; border-radius:50%;
    background:rgba(240,68,56,.08); color:var(--color-error);
    margin:0 auto var(--space-4);
  }
  .error-state .error-icon .icon{ width:26px;height:26px;stroke-width:2; }
  .error-state h3{ font-size:var(--font-size-base); font-weight:var(--font-weight-bold); margin:0 0 var(--space-2); }
  .error-state p{ font-size:var(--font-size-sm); color:var(--text-secondary); margin:0 0 var(--space-4); line-height:var(--line-height-normal); }
  .error-state .btn{ width:auto; display:inline-flex; padding:13px 22px; }
</style>
</head>
<body>

<div class="container-mobile">

  <header class="header-dark">
    <div class="header-top">
      <a class="pill-link" href="detalhe-ordem.html" id="backLink">
        <svg class="icon icon-sm" viewBox="0 0 24 24" style="display:inline-block;vertical-align:middle;margin-right:2px;">
          <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </svg>
        Voltar
      </a>
      <div class="brand">WENEED<span class="dot">.</span></div>
      <div style="width:64px;"></div>
    </div>
    <h2 style="font-size:var(--font-size-lg); margin:0; font-weight:var(--font-weight-bold); letter-spacing:var(--tracking-tight);">
      Pagamento Pix
    </h2>
  </header>

  <div class="wrap">
    <div id="content">
      <div class="loading-spinner">Carregando pagamento...</div>
    </div>

    <div id="errorState" style="display:none;"></div>

    <div id="successState" class="success-state">
      <div class="check-circle">
        <svg class="icon" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h3>Pagamento confirmado</h3>
      <p>O prestador foi liberado para iniciar o serviço. Acompanhe tudo pela tela da ordem.</p>
      <a class="btn btn-primary" href="detalhe-ordem.html" id="goToOrderBtn" style="text-decoration:none;">
        <svg class="icon icon-sm" viewBox="0 0 24 24">
          <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
        </svg>
        Ver minha ordem
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-cliente.js"></script>
<script src="../js/auth.js"></script>
<script src="../app.js"></script>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const contractId = urlParams.get('contract_id') || urlParams.get('id');
  let contractData = null;
  let pollingInterval = null;
  let countdownInterval = null;
  let actionInProgress = false;

  function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>'"]/g, tag => ({
      '&': '&amp;','<': '&lt;','>': '&gt;',"'": '&#39;','"': '&quot;'
    }[tag]));
  }

  function formatarMoeda(v) {
    const n = Number(v) || 0;
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n);
  }

  function mostrarErro(titulo, mensagem) {
    document.getElementById('content').style.display = 'none';
    document.getElementById('errorState').style.display = 'block';
    document.getElementById('errorState').innerHTML = `
      <div class="error-state">
        <div class="error-icon">
          <svg class="icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" x2="12" y1="8" y2="12"/>
            <line x1="12" x2="12.01" y1="16" y2="16"/>
          </svg>
        </div>
        <h3>${escapeHTML(titulo)}</h3>
        <p>${escapeHTML(mensagem)}</p>
        <a class="btn btn-primary" href="dashboard-cliente.html">Voltar ao painel</a>
      </div>`;
    document.getElementById('backLink').style.display = 'none';
  }

  async function init() {
    const supabase = window.supabaseClient;
    if (!supabase) return mostrarErro('Erro de configuração', 'Recarregue a página.');
    if (!contractId) return mostrarErro('Link inválido', 'Nenhum contrato foi especificado.');

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) return (window.location.href = '../index.html');

    await carregarContrato(supabase);
  }

  async function carregarContrato(supabase) {
    const { data, error } = await supabase
      .from('contracts')
      .select(`
        id, status, final_price, platform_fee,
        mp_status, mp_qr_code, mp_qr_code_base64, mp_ticket_url, mp_expires_at,
        payment_deadline_at,
        demand:demands ( id, title, city, client_id ),
        proposal:proposals (
          provider:profiles ( full_name, company_name )
        )
      `)
      .eq('id', contractId)
      .single();

    if (error || !data) {
      console.error(error);
      return mostrarErro('Contrato não encontrado', 'Verifique o link ou volte ao painel.');
    }

    contractData = data;

    // Se já foi pago enquanto o cliente estava aqui
    if (data.mp_status === 'approved' || data.status === 'em_andamento') {
      return mostrarSucesso();
    }

    // Se ainda não gerou o Pix, gera agora
    if (!data.mp_qr_code && !data.mp_qr_code_base64) {
      await gerarPix(supabase);
    } else {
      renderPix();
    }

    iniciarPolling(supabase);
  }

  async function gerarPix(supabase) {
    if (actionInProgress) return;
    actionInProgress = true;

    try {
      const { data: { session } } = await supabase.auth.getSession();

      const res = await fetch(
        'https://kwshthfbhzjaxyaoiokz.supabase.co/functions/v1/create-payment',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ contract_id: contractId }),
        }
      );

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || 'Erro ao gerar Pix');
      }

      const { qr_code, qr_code_base64, mp_qr_code } = await res.json();

      contractData.mp_qr_code = qr_code || mp_qr_code;
      contractData.mp_qr_code_base64 = qr_code_base64;

      renderPix();
    } catch (err) {
      console.error('gerarPix:', err);
      mostrarErro('Não foi possível gerar o Pix', err.message);
    } finally {
      actionInProgress = false;
    }
  }

  function renderPix() {
    const c = contractData;
    const provider = c.proposal?.provider || {};
    const providerName = provider.company_name || provider.full_name || 'Prestador';
    const demandTitle = c.demand?.title || 'Serviço';
    const total = Number(c.final_price) || 0;

    document.getElementById('content').innerHTML = `
      <div class="countdown" id="countdownBox">
        <svg class="icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>Pague em até <b id="countdownValue">30:00</b></span>
      </div>

      <div class="card">
        <div class="card-label"><div class="dot"></div> Resumo</div>

        <div class="service-summary">
          <div class="service-icon">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </div>
          <div class="service-info">
            <h3>${escapeHTML(demandTitle)}</h3>
            <span class="provider">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              ${escapeHTML(providerName)}
            </span>
          </div>
        </div>

        <div class="detail-lines">
          <div class="detail-line total">
            <span>Total a pagar</span>
            <span>${formatarMoeda(total)}</span>
          </div>
        </div>

        <div class="security-notice">
          <svg class="icon icon-sm" viewBox="0 0 24 24">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>
            <b>Pagamento via Pix</b>
            O WENEED retém o valor com segurança e libera ao prestador após a conclusão do serviço.
          </span>
        </div>
      </div>

      <div class="card" style="margin-top:var(--space-3);">
        <div class="card-label"><div class="dot"></div> Pague com Pix</div>

        <div class="qr-block">
          ${c.mp_qr_code_base64 ? `
            <div class="qr-image">
              <img src="data:image/png;base64,${escapeHTML(c.mp_qr_code_base64)}" alt="QR Code Pix">
            </div>
          ` : ''}

          ${c.mp_qr_code ? `
            <div class="qr-code-text" id="pixCodeBox">${escapeHTML(c.mp_qr_code)}</div>
            <button class="copy-btn" id="copyBtn" type="button">
              <svg class="icon" viewBox="0 0 24 24">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              Copiar código Pix
            </button>
          ` : ''}
        </div>
      </div>

      <p style="text-align:center; font-size:var(--font-size-xs); color:var(--text-secondary); margin-top:var(--space-3);">
        Abra o app do seu banco, escolha Pix → Ler QR Code ou Pix Copia e Cola.
      </p>
    `;

    // Botão copiar
    const copyBtn = document.getElementById('copyBtn');
    if (copyBtn) {
      copyBtn.addEventListener('click', async () => {
        const code = document.getElementById('pixCodeBox')?.textContent || '';
        try {
          await navigator.clipboard.writeText(code);
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = `
            <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            Copiado
          `;
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = `
              <svg class="icon" viewBox="0 0 24 24">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              Copiar código Pix
            `;
          }, 2500);
        } catch (e) {
          alert('Não foi possível copiar. Selecione o texto e copie manualmente.');
        }
      });
    }

    iniciarCountdown();
  }

  function iniciarCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);

    const deadline = contractData.payment_deadline_at
      ? new Date(contractData.payment_deadline_at)
      : new Date(Date.now() + 30 * 60 * 1000);

    const update = () => {
      const diff = deadline - new Date();
      const el = document.getElementById('countdownValue');
      if (!el) return;

      if (diff <= 0) {
        el.textContent = '00:00';
        clearInterval(countdownInterval);
        mostrarErro('Tempo esgotado', 'O prazo para pagamento expirou. O serviço foi cancelado.');
        return;
      }

      const min = Math.floor(diff / 60000);
      const sec = Math.floor((diff % 60000) / 1000);
      el.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    };

    update();
    countdownInterval = setInterval(update, 1000);
  }

  function iniciarPolling(supabase) {
    if (pollingInterval) clearInterval(pollingInterval);

    pollingInterval = setInterval(async () => {
      const { data } = await supabase
        .from('contracts')
        .select('status, mp_status')
        .eq('id', contractId)
        .single();

      if (!data) return;

      if (data.mp_status === 'approved' || data.status === 'em_andamento') {
        clearInterval(pollingInterval);
        clearInterval(countdownInterval);
        mostrarSucesso();
      }

      if (data.status === 'cancelado') {
        clearInterval(pollingInterval);
        clearInterval(countdownInterval);
        mostrarErro('Pagamento cancelado', 'O prazo expirou ou o serviço foi cancelado.');
      }
    }, 3000);
  }

  function mostrarSucesso() {
    document.getElementById('content').style.display = 'none';
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('successState').classList.add('show');
    document.getElementById('backLink').style.display = 'none';
    document.getElementById('goToOrderBtn').href = `detalhe-ordem.html?id=${contractId}`;
  }

  init();
</script>
</body>
</html>
