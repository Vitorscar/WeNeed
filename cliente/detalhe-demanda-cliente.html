<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Detalhe da demanda · WENEED</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="stylesheet" href="../style.css">

<style>
  /* ---------- ICON SYSTEM ---------- */
  .icon{
    width:16px; height:16px;
    stroke:currentColor;
    stroke-width:1.75;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
    flex-shrink:0;
    display:block;
  }
  .icon-sm{ width:14px; height:14px; stroke-width:2; }
  .icon-md{ width:18px; height:18px; stroke-width:1.75; }
  .icon-lg{ width:22px; height:22px; stroke-width:1.5; }
  .icon-xl{ width:28px; height:28px; stroke-width:1.5; }

  /* ---------- HEADER CENTRALIZADO ---------- */
  .header-center{
    text-align:center;
    padding:var(--space-3) 0 var(--space-5);
  }
  .header-center h1{
    font-size:var(--font-size-xl);
    font-weight:var(--font-weight-extrabold);
    letter-spacing:var(--tracking-tighter);
    margin:var(--space-4) 0 var(--space-2);
    color:var(--color-white);
    line-height:var(--line-height-snug);
    word-break:break-word;
  }
  .header-center .sub{
    color:var(--color-gray-400);
    font-size:var(--font-size-sm);
    margin:0;
    font-weight:var(--font-weight-medium);
  }

  /* ---------- WRAP ---------- */
  .content-wrap{
    padding:0 var(--space-5) var(--space-10);
    margin-top:calc(-1 * var(--space-3));
  }

  /* ---------- DEMAND DETAIL ---------- */
  .demand-description{
    font-size:var(--font-size-sm);
    color:var(--text-primary);
    line-height:var(--line-height-relaxed);
    margin:0 0 var(--space-4);
    font-style:italic;
  }

  .demand-images{
    display:flex;
    gap:var(--space-2);
    overflow-x:auto;
    margin-bottom:var(--space-4);
    padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .demand-images::-webkit-scrollbar{ display:none; }
  .demand-images img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:var(--radius-sm);
    border:1px solid var(--border-default);
    cursor:pointer;
    flex-shrink:0;
  }

  .detail-lines{
    border-top:1px solid var(--border-default);
    padding-top:var(--space-3);
  }
  .detail-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:var(--space-3);
    padding:7px 0;
    font-size:var(--font-size-sm);
  }
  .detail-line span:first-child{ color:var(--text-secondary); }
  .detail-line span:last-child{
    font-weight:var(--font-weight-semibold);
    color:var(--text-primary);
    text-align:right;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .detail-line .icon{ width:12px; height:12px; stroke-width:2; }
  .detail-line .budget{
    color:var(--color-brand-blue-deep);
    font-weight:var(--font-weight-bold);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- PROPOSALS LIST ---------- */
  .proposals-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:var(--space-3);
    margin-bottom:var(--space-3);
  }
  .proposals-header h2{
    font-size:var(--font-size-base);
    font-weight:var(--font-weight-bold);
    color:var(--text-primary);
    letter-spacing:var(--tracking-tight);
    margin:0;
  }
  .proposals-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:var(--font-size-xs);
    font-weight:var(--font-weight-bold);
    color:var(--color-brand-blue-deep);
    background:rgba(0,68,204,.08);
    padding:4px 10px;
    border-radius:var(--radius-full);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }

  .proposal-card{
    background:var(--surface-default);
    border:1px solid var(--border-default);
    border-radius:var(--radius-md);
    padding:var(--space-4);
    margin-bottom:var(--space-3);
  }

  .proposal-head{
    display:flex;
    align-items:center;
    gap:var(--space-3);
    margin-bottom:var(--space-3);
  }
  .proposal-avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--color-gray-50);
    border:1px solid var(--border-default);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--color-gray-700);
    flex-shrink:0;
    overflow:hidden;
  }
  .proposal-avatar img{ width:100%; height:100%; object-fit:cover; }
  .proposal-avatar .icon{ width:20px; height:20px; }

  .proposal-provider{
    flex:1;
    min-width:0;
  }
  .proposal-provider-name{
    font-size:var(--font-size-base);
    font-weight:var(--font-weight-bold);
    color:var(--text-primary);
    letter-spacing:var(--tracking-tight);
    margin:0 0 2px;
    word-break:break-word;
  }
  .proposal-provider-meta{
    font-size:var(--font-size-xs);
    color:var(--text-secondary);
    display:inline-flex;
    align-items:center;
    gap:6px;
    line-height:var(--line-height-normal);
  }
  .proposal-provider-meta .icon{ width:12px; height:12px; stroke-width:2; }

  .proposal-value{
    font-size:var(--font-size-lg);
    font-weight:var(--font-weight-extrabold);
    color:var(--text-primary);
    letter-spacing:var(--tracking-tighter);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }

  .proposal-message{
    font-size:var(--font-size-sm);
    color:var(--text-secondary);
    line-height:var(--line-height-normal);
    margin:0 0 var(--space-3);
    padding:var(--space-3);
    background:var(--surface-subtle);
    border-radius:var(--radius-sm);
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .proposal-meta{
    display:flex;
    flex-wrap:wrap;
    gap:var(--space-3);
    font-size:var(--font-size-xs);
    color:var(--text-secondary);
    margin-bottom:var(--space-3);
  }
  .proposal-meta span{
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .proposal-meta .icon{ width:12px; height:12px; stroke-width:2; }

  .proposal-actions{
    display:flex;
    gap:var(--space-2);
    padding-top:var(--space-3);
    border-top:1px solid var(--border-subtle);
  }
  .proposal-actions .btn{
    flex:1;
    padding:12px 16px;
    font-size:var(--font-size-sm);
    text-transform:none;
    letter-spacing:var(--tracking-normal);
    gap:6px;
  }
  .proposal-actions .btn .icon{ width:14px; height:14px; stroke-width:2.25; }

  .btn-accept{
    background:var(--color-black);
    color:var(--color-white);
    border:none;
  }
  .btn-accept:hover:not(:disabled){ background:var(--color-gray-900); }

  .btn-reject{
    background:transparent;
    border:1.5px solid var(--border-default);
    color:var(--text-secondary);
  }
  .btn-reject:hover:not(:disabled){
    border-color:var(--color-error);
    color:var(--color-error);
  }

  /* ---------- ACCEPTED STATE ---------- */
  .accepted-banner{
    background:var(--color-black);
    color:var(--color-white);
    border-radius:var(--radius-lg);
    padding:var(--space-5);
    margin-bottom:var(--space-4);
    text-align:center;
  }
  .accepted-banner .icon-circle{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:56px;
    height:56px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    color:var(--color-white);
    margin:0 auto var(--space-4);
  }
  .accepted-banner .icon-circle .icon{ width:26px; height:26px; stroke-width:2.5; }
  .accepted-banner h3{
    font-size:var(--font-size-lg);
    font-weight:var(--font-weight-extrabold);
    letter-spacing:var(--tracking-tight);
    margin:0 0 var(--space-2);
  }
  .accepted-banner p{
    font-size:var(--font-size-sm);
    color:var(--color-gray-400);
    line-height:var(--line-height-normal);
    margin:0 0 var(--space-5);
  }
  .accepted-banner .btn{
    background:var(--color-white);
    color:var(--color-black);
    border:none;
    padding:13px 22px;
    border-radius:var(--radius-sm);
    font-weight:var(--font-weight-bold);
    font-size:var(--font-size-sm);
    letter-spacing:var(--tracking-wide);
    text-transform:uppercase;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .accepted-banner .btn .icon{ width:14px; height:14px; stroke-width:2.25; }

  /* ---------- EMPTY / ERROR ---------- */
  .empty-state{
    text-align:center;
    padding:var(--space-6) var(--space-4);
    background:var(--surface-default);
    border:1px dashed var(--border-default);
    border-radius:var(--radius-md);
    color:var(--text-secondary);
  }
  .empty-state .empty-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:56px; height:56px;
    border-radius:50%;
    background:var(--surface-subtle);
    color:var(--color-gray-400);
    margin:0 auto var(--space-3);
  }
  .empty-state .empty-icon .icon{ width:26px; height:26px; stroke-width:1.5; }
  .empty-state h3{
    font-size:var(--font-size-base);
    font-weight:var(--font-weight-bold);
    color:var(--text-primary);
    margin:0 0 var(--space-2);
    letter-spacing:var(--tracking-tight);
  }
  .empty-state p{
    font-size:var(--font-size-sm);
    line-height:var(--line-height-normal);
    margin:0 auto;
    max-width:42ch;
  }

  /* ---------- LOADING ---------- */
  .loading-spinner{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:var(--space-3);
    padding:var(--space-10);
    color:var(--text-secondary);
    font-size:var(--font-size-sm);
    font-weight:var(--font-weight-medium);
  }
  .loading-spinner::after{
    content:'';
    display:inline-block;
    width:20px; height:20px;
    border:2.5px solid var(--color-gray-200);
    border-top-color:var(--color-brand-blue-deep);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- CONFIRM MODAL ---------- */
  .confirm-modal{
    position:fixed;
    inset:0;
    background:rgba(10,10,10,.55);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    z-index:var(--z-modal);
    display:none;
    align-items:center;
    justify-content:center;
    padding:var(--space-5);
  }
  .confirm-modal.active{ display:flex; }
  .confirm-modal-content{
    background:var(--surface-default);
    border-radius:var(--radius-lg);
    padding:var(--space-6);
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:var(--shadow-lg);
  }
  .confirm-modal-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--color-gray-50);
    color:var(--color-black);
    margin:0 auto var(--space-4);
  }
  .confirm-modal-icon .icon{ width:26px; height:26px; stroke-width:1.5; }
  .confirm-modal-content h3{
    font-size:var(--font-size-lg);
    font-weight:var(--font-weight-extrabold);
    letter-spacing:var(--tracking-tight);
    margin:0 0 var(--space-2);
    color:var(--text-primary);
  }
  .confirm-modal-content p{
    font-size:var(--font-size-sm);
    color:var(--text-secondary);
    line-height:var(--line-height-normal);
    margin:0 0 var(--space-5);
  }
  .confirm-modal-summary{
    background:var(--surface-subtle);
    border-radius:var(--radius-sm);
    padding:var(--space-3) var(--space-4);
    margin-bottom:var(--space-5);
    text-align:left;
  }
  .confirm-modal-summary .row{
    display:flex;
    justify-content:space-between;
    gap:var(--space-3);
    padding:5px 0;
    font-size:var(--font-size-sm);
  }
  .confirm-modal-summary .row span:first-child{ color:var(--text-secondary); }
  .confirm-modal-summary .row span:last-child{
    font-weight:var(--font-weight-semibold);
    color:var(--text-primary);
    text-align:right;
  }
  .confirm-modal-actions{
    display:flex;
    gap:var(--space-2);
  }
  .confirm-modal-actions .btn{
    flex:1;
    padding:13px 16px;
    font-size:var(--font-size-sm);
    text-transform:none;
    letter-spacing:var(--tracking-normal);
  }

  /* ---------- TOAST ---------- */
  .toast-container{
    position:fixed;
    bottom:90px;
    right:24px;
    left:24px;
    z-index:var(--z-toast);
    display:flex;
    flex-direction:column;
    gap:var(--space-2);
    pointer-events:none;
    align-items:flex-end;
  }
  .toast{
    background:var(--color-black);
    color:var(--color-white);
    padding:var(--space-3) var(--space-5);
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow-lg);
    display:flex;
    align-items:center;
    gap:var(--space-3);
    font-size:var(--font-size-sm);
    font-weight:var(--font-weight-medium);
    animation:slideIn .35s cubic-bezier(.16,1,.3,1) forwards;
    min-width:260px;
    max-width:380px;
    border-left:4px solid var(--color-brand-blue);
    pointer-events:auto;
  }
  .toast.success{ border-left-color:var(--color-success); }
  .toast.error{ border-left-color:var(--color-error); }
  .toast .icon{ width:16px; height:16px; stroke-width:2.25; }

  @keyframes slideIn{
    from{ transform:translateX(120%); opacity:0; }
    to{ transform:translateX(0); opacity:1; }
  }
  @keyframes slideOut{
    from{ transform:translateX(0); opacity:1; }
    to{ transform:translateX(120%); opacity:0; }
  }

  /* ---------- MOBILE NAV ---------- */
  .mobile-nav{ display:none; }

  @media (max-width:1023px){
    .mobile-nav{
      display:grid !important;
      grid-template-columns:1fr 1fr 72px 1fr 1fr;
      position:fixed;
      bottom:0; left:0; right:0;
      height:var(--app-mobile-nav-height);
      background:var(--surface-default);
      border-top:1px solid var(--border-default);
      align-items:stretch;
      z-index:var(--z-sticky);
      padding-bottom:env(safe-area-inset-bottom);
      box-shadow:0 -4px 20px rgba(10,10,10,.05);
      isolation:isolate;
    }
    .mobile-nav-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      text-decoration:none;
      color:var(--color-gray-400);
      font-size:11px;
      font-weight:var(--font-weight-semibold);
      height:100%;
      position:relative;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      user-select:none;
      transition:color var(--duration-base), transform var(--duration-fast);
    }
    .mobile-nav-item:active{ transform:scale(0.88); }
    .mobile-nav-item.active{ color:var(--color-brand-blue-deep); }
    .mobile-nav-item.active::before{
      content:'';
      position:absolute;
      top:6px; left:50%;
      transform:translateX(-50%);
      width:5px; height:5px;
      background:var(--color-brand-blue);
      border-radius:50%;
    }
    .mobile-nav-fab-wrapper{
      display:flex;
      align-items:flex-start;
      justify-content:center;
      position:relative;
    }
    .mobile-nav-fab{
      width:54px; height:54px;
      background:var(--color-black);
      color:var(--color-white);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      box-shadow:0 4px 15px rgba(10,10,10,.25);
      margin-top:-22px;
      border:3px solid var(--surface-default);
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      position:relative;
      z-index:10;
    }
    .mobile-nav-fab:active{ transform:scale(0.9); }
    .mobile-nav-fab .icon{ width:22px; height:22px; stroke-width:2.25; }
  }

  @media (min-width:640px){
    .toast-container{ right:16px; left:auto; }
  }
</style>
</head>
<body>

<div class="container-mobile">
  <!-- HEADER ESCURO -->
  <div class="header-dark">
    <div class="header-top">
      <a class="pill-link" href="minhas-demandas.html">
        <svg class="icon icon-sm" viewBox="0 0 24 24" style="display:inline-block;vertical-align:middle;margin-right:2px;">
          <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </svg>
        Voltar
      </a>
      <div class="brand">WENEED<span class="dot">.</span></div>
      <div style="width:64px;"></div>
    </div>

    <div class="header-center">
      <span id="headerStatusBadge" class="status-badge status-recebendo">
        Carregando...
      </span>

      <p class="sub" id="headerSub">...</p>
    </div>
  </div>

  <!-- CONTEÚDO -->
  <div class="content-wrap">

    <!-- ESTADO DE ACEITO (aparece se já tiver contrato) -->
    <div id="acceptedContainer"></div>

    <!-- DETALHES DA DEMANDA -->
    <div class="card" id="demandCard">
      <div class="card-label">
        <div class="dot"></div>
        Detalhes da demanda
      </div>
      <div id="demandBody">
        <div class="loading-spinner">Carregando demanda...</div>

    <!-- PROPOSTAS -->
    <div id="proposalsSection" style="display:none;">
      <div class="card" style="margin-top:var(--space-3);">

          <h2>Propostas recebidas</h2>
          <span class="proposals-count" id="proposalsCount">0</span>

        <div id="proposalsList"></div>

    </div>

  </div>
</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav" aria-label="Navegação principal">

  </a>

  <a href="minhas-demandas.html" class="mobile-nav-item active">
    <span class="nav-icon">
      <svg class="icon icon-lg" viewBox="0 0 24 24">
        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
      </svg>

  <div class="mobile-nav-fab-wrapper">

  <a href="servicos-contratados.html" class="mobile-nav-item">

      <svg class="icon icon-lg" viewBox="0 0 24 24">

</nav>

<!-- CONFIRM MODAL -->
<div class="confirm-modal" id="confirmModal">
  <div class="confirm-modal-content">
    <div class="confirm-modal-icon">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>
    <h3>Aceitar proposta?</h3>
    <p>Ao aceitar, o prestador será notificado. Você será levado para o pagamento em seguida.</p>

    <div class="confirm-modal-summary" id="confirmSummary"></div>

    <div class="confirm-modal-actions">
      <button class="btn btn-outline" onclick="closeConfirmModal()">Cancelar</button>
      <button class="btn btn-primary" id="confirmAcceptBtn">Aceitar e pagar</button>

  </div>
</div>

<!-- TOAST CONTAINER -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-cliente.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../app.js"></script>

<script>
  /* ============================================
     ESTADO
     ============================================ */
  let currentUserId = null;
  let currentProfileId = null;
  let currentDemandId = null;
  let demandData = null;
  let proposalsCache = [];
  let acceptedContract = null;
  let proposalToAccept = null;
  let actionInProgress = false;

  const urlParams = new URLSearchParams(window.location.search);
  currentDemandId = urlParams.get('id');

  /* ============================================
     AUXILIARES
     ============================================ */
  function escapeHTML(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>'"]/g, tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag]));
  }

  function formatarMoeda(v) {
    const n = Number(v) || 0;
    return new Intl.NumberFormat('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    }).format(n);
  }

  function formatarPrazo(dias) {
    const d = parseInt(dias, 10);
    if (isNaN(d)) return '—';
    if (d === 0) return 'Ainda hoje';
    if (d === 1) return 'Amanhã';
    if (d < 7) return `${d} dias`;
    if (d === 7) return '1 semana';
    if (d === 15) return '2 semanas';
    if (d === 30) return '1 mês';
    return `${d} dias`;
  }

  function formatarData(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('pt-BR', {
      day: '2-digit',
      month: 'short',
      year: 'numeric'
    });
  }

  function mostrarToast(mensagem, tipo = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${tipo}`;

    const icon = tipo === 'success'
      ? `<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
      : tipo === 'error'
        ? `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>`
        : `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>`;

    toast.innerHTML = `${icon}<span>${escapeHTML(mensagem)}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.animation = 'slideOut .3s ease forwards';
      setTimeout(() => toast.remove(), 300);
    }, 3200);
  }

  /* ============================================
     STATUS MAP
     ============================================ */
  const STATUS_MAP = {
    'OPEN':         { label: 'Aguardando propostas', class: 'status-recebendo' },
    'ABERTA':       { label: 'Aguardando propostas', class: 'status-recebendo' },
    'EM_PROPOSTAS': { label: 'Com propostas',        class: 'status-recebendo' },
    'EM_ANDAMENTO': { label: 'Em andamento',         class: 'status-andamento' },
    'ANDAMENTO':    { label: 'Em andamento',         class: 'status-andamento' },
    'CONCLUIDO':    { label: 'Concluída',            class: 'status-concluido' },
    'CONCLUIDA':    { label: 'Concluída',            class: 'status-concluido' },
    'CANCELADO':    { label: 'Cancelada',            class: 'status-cancelado' },
    'CANCELADA':    { label: 'Cancelada',            class: 'status-cancelado' }
  };

  /* ============================================
     INIT
     ============================================ */
  async function init() {
    const supabase = window.supabaseClient;
    if (!supabase) {
      window.location.href = '../index.html';
      return;
    }

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = '../index.html';
      return;
    }
    currentUserId = session.user.id;

    if (!currentDemandId) {
      window.location.href = 'minhas-demandas.html';
      return;
    }

    const { data: profile } = await supabase
      .from('profiles')
      .select('id')
      .eq('user_id', currentUserId)
      .single();

    if (!profile) {
      alert('Perfil não encontrado.');
      window.location.href = 'minhas-demandas.html';
      return;
    }
    currentProfileId = profile.id;

    configurarConfirmModal(supabase);
    await carregarDemanda(supabase);
    await carregarPropostas(supabase);
    await carregarContratoAceito(supabase);
    configurarRealtime(supabase);
  }

  /* ============================================
     CARREGAR DEMANDA
     ============================================ */
  async function carregarDemanda(supabase) {
    const { data: demand, error } = await supabase
      .from('demands')
      .select(`
        id,
        title,
        description,
        budget_min,
        budget_max,
        city,
        neighborhood,
        status,
        created_at,
        media_urls,
        category_id,
        categories ( name, service_type ),
        client_id
      `)
      .eq('id', currentDemandId)
      .single();

    if (error || !demand) {
      console.error('Erro ao carregar demanda:', error);
      document.getElementById('demandBody').innerHTML = `
        <div class="empty-state">
          <h3>Demanda não encontrada</h3>
          <p>Volte e tente novamente.</p>
        </div>`;
      return;
    }

    if (demand.client_id !== currentProfileId) {
      document.getElementById('demandBody').innerHTML = `
        <div class="empty-state">
          <h3>Acesso negado</h3>
          <p>Esta demanda não pertence à sua conta.</p>
        </div>`;
      return;
    }

    demandData = demand;

    /* Header */
    const st = STATUS_MAP[demand.status] || { label: demand.status, class: 'status-recebendo' };
    document.getElementById('headerStatusBadge').className = `status-badge ${st.class}`;
    document.getElementById('headerStatusBadge').textContent = st.label;
    document.getElementById('headerTitle').textContent = demand.title || 'Demanda';
    document.getElementById('headerSub').textContent =
      `${demand.city || 'Local não definido'}${demand.neighborhood ? ' · ' + demand.neighborhood : ''}`;

    /* Body */
    renderDemanda(demand);
  }

  function renderDemanda(demand) {
    const isFreelance = demand.categories?.service_type === 'FREELANCE';
    const budget = demand.budget_max
      ? `Até ${formatarMoeda(demand.budget_max)}`
      : (demand.budget_min
        ? `A partir de ${formatarMoeda(demand.budget_min)}`
        : 'A combinar');

    const location = isFreelance
      ? 'Online'
      : [demand.neighborhood, demand.city].filter(Boolean).join(', ') || 'Local não definido';

    let imagesHtml = '';
    if (demand.media_urls && demand.media_urls.length > 0) {
      imagesHtml = `
        <div class="demand-images">
          ${demand.media_urls.map(url =>
            `<img src="${escapeHTML(url)}" alt="" loading="lazy" onclick="window.open('${escapeHTML(url)}')">`
          ).join('')}
        </div>`;
    }

    document.getElementById('demandBody').innerHTML = `
      ${imagesHtml}

      <p class="demand-description">"${escapeHTML(demand.description)}"</p>

      <div class="detail-lines">
        <div class="detail-line">
          <span>Categoria</span>
          <span>${escapeHTML(demand.categories?.name || 'Serviço')}</span>
        </div>
        <div class="detail-line">
          <span>Local</span>
          <span>
            ${isFreelance
              ? `<svg class="icon" viewBox="0 0 24 24">
                   <rect width="20" height="14" x="2" y="3" rx="2"/>
                   <line x1="8" x2="16" y1="21" y2="21"/>
                   <line x1="12" x2="12" y1="17" y2="21"/>
                 </svg>`
              : `<svg class="icon" viewBox="0 0 24 24">
                   <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                   <circle cx="12" cy="10" r="3"/>
                 </svg>`}
            ${escapeHTML(location)}
          </span>
        </div>
        <div class="detail-line">
          <span>Orçamento</span>
          <span class="budget">${budget}</span>
        </div>
        <div class="detail-line">
          <span>Publicada em</span>
          <span>${formatarData(demand.created_at)}</span>
        </div>
      </div>
    `;
  }

  /* ============================================
     CARREGAR PROPOSTAS
     ============================================ */
  async function carregarPropostas(supabase) {
    const { data: proposals, error } = await supabase
      .from('proposals')
      .select(`
        id,
        price,
        deadline_days,
        message,
        status,
        created_at,
        provider:profiles!proposals_provider_id_fkey (
          id,
          full_name,
          company_name,
          avatar_url,
          city,
          uf
        )
      `)
      .eq('demand_id', currentDemandId)
      .in('status', ['pendente', 'PENDENTE'])
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Erro ao carregar propostas:', error);
      proposalsCache = [];
      renderPropostas([]);
      return;
    }

    proposalsCache = proposals || [];
    renderPropostas(proposalsCache);
  }

  function renderPropostas(propostas) {
    const section = document.getElementById('proposalsSection');
    const list = document.getElementById('proposalsList');
    const countEl = document.getElementById('proposalsCount');

    section.style.display = 'block';
    countEl.textContent = propostas.length;

    if (propostas.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h3>Nenhuma proposta ainda</h3>
          <p>Quando um prestador enviar uma proposta, ela aparece aqui.</p>
        </div>`;
      return;
    }

    list.innerHTML = propostas.map(p => {
      const provider = p.provider || {};
      const providerName = provider.company_name || provider.full_name || 'Prestador';
      const providerLocation = provider.city
        ? `${provider.city}${provider.uf ? ', ' + provider.uf : ''}`
        : 'Local não informado';

      const avatarHtml = provider.avatar_url
        ? `<img src="${escapeHTML(provider.avatar_url)}" alt="">`
        : `<svg class="icon" viewBox="0 0 24 24">
             <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
             <circle cx="12" cy="7" r="4"/>
           </svg>`;

      const dataFmt = p.created_at
        ? new Date(p.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })
        : '';

      return `
        <div class="proposal-card" data-proposal-id="${escapeHTML(p.id)}">
          <div class="proposal-head">
            <div class="proposal-avatar">${avatarHtml}</div>
            <div class="proposal-provider">
              <h3 class="proposal-provider-name">${escapeHTML(providerName)}</h3>
              <span class="proposal-provider-meta">
                <svg class="icon" viewBox="0 0 24 24">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
                ${escapeHTML(providerLocation)}
              </span>
            </div>
            <div class="proposal-value">${formatarMoeda(p.price)}</div>
          </div>

          <div class="proposal-meta">
            <span>
              <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              ${escapeHTML(formatarPrazo(p.deadline_days))}
            </span>
            ${dataFmt ? `<span>
              <svg class="icon" viewBox="0 0 24 24">
                <rect width="18" height="18" x="3" y="4" rx="2"/>
                <path d="M16 2v4M8 2v4M3 10h18"/>
              </svg>
              ${dataFmt}
            </span>` : ''}
          </div>

          ${p.message ? `<p class="proposal-message">${escapeHTML(p.message)}</p>` : ''}

          <div class="proposal-actions">
            <button class="btn btn-reject" data-action="reject" data-id="${escapeHTML(p.id)}">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
              </svg>
              Recusar
            </button>
            <button class="btn btn-accept" data-action="accept" data-id="${escapeHTML(p.id)}">
              <svg class="icon" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Aceitar
            </button>
          </div>
        </div>
      `;
    }).join('');

    list.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        if (action === 'accept') abrirConfirmAceite(id);
        else if (action === 'reject') recusarProposta(id);
      });
    });
  }

  /* ============================================
     CARREGAR CONTRATO ACEITO
     ============================================ */
  async function carregarContratoAceito(supabase) {
    const { data: contract } = await supabase
      .from('contracts')
      .select(`
        id,
        status,
        final_price,
        created_at,
        proposal:proposals (
          provider:profiles (
            full_name,
            company_name
          )
        )
      `)
      .eq('demand_id', currentDemandId)
      .order('created_at', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (!contract) return;

    acceptedContract = contract;
    renderAceito(contract);
  }

  function renderAceito(contract) {
    const container = document.getElementById('acceptedContainer');
    const provider = contract.proposal?.provider || {};
    const providerName = provider.company_name || provider.full_name || 'Prestador';

    const statusMap = {
      'aguardando_pagamento':       { label: 'Aguardando pagamento', action: 'pagar' },
      'pago_aguardando_inicio':     { label: 'Aguardando início',    action: 'acompanhar' },
      'em_andamento':               { label: 'Em andamento',         action: 'acompanhar' },
      'aguardando_confirmacao_fim': { label: 'Confirme a finalização', action: 'confirmar' },
      'finalizado':                 { label: 'Concluído',            action: 'avaliar' }
    };

    const st = statusMap[contract.status] || { label: contract.status, action: 'acompanhar' };

    let btnLabel = 'Acompanhar serviço';
    let btnIcon = `<svg class="icon" viewBox="0 0 24 24">
      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>`;

    if (st.action === 'pagar') {
      btnLabel = 'Ir para pagamento';
      btnIcon = `<svg class="icon" viewBox="0 0 24 24">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>`;
    } else if (st.action === 'confirmar') {
      btnLabel = 'Confirmar finalização';
      btnIcon = `<svg class="icon" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/>
      </svg>`;
    }

    let href = `detalhe-ordem.html?id=${contract.id}`;
    if (st.action === 'pagar') {
      href = `pagamento.html?contract_id=${contract.id}`;
    }

    container.innerHTML = `
      <div class="accepted-banner" style="margin-top:var(--space-4);">
        <div class="icon-circle">
          <svg class="icon" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h3>Proposta aceita</h3>
        <p>Você já contratou <strong>${escapeHTML(providerName)}</strong> para este serviço.<br>Status atual: <strong>${escapeHTML(st.label)}</strong>.</p>
        <a class="btn" href="${href}">
          ${btnIcon}
          ${btnLabel}
        </a>
      </div>
    `;
  }

  /* ============================================
     CONFIRM MODAL
     ============================================ */
  function configurarConfirmModal(supabase) {
    document.getElementById('confirmAcceptBtn').addEventListener('click', async () => {
      if (!proposalToAccept || actionInProgress) return;
      await aceitarProposta(supabase, proposalToAccept);
    });

    document.getElementById('confirmModal').addEventListener('click', (e) => {
      if (e.target.id === 'confirmModal') closeConfirmModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeConfirmModal();
    });
  }

  function abrirConfirmAceite(proposalId) {
    const p = proposalsCache.find(x => x.id === proposalId);
    if (!p) return;

    proposalToAccept = proposalId;

    const provider = p.provider || {};
    const providerName = provider.company_name || provider.full_name || 'Prestador';

    document.getElementById('confirmSummary').innerHTML = `
      <div class="row"><span>Prestador</span><span>${escapeHTML(providerName)}</span></div>
      <div class="row"><span>Demanda</span><span>${escapeHTML(demandData.title)}</span></div>
      <div class="row"><span>Valor</span><span>${formatarMoeda(p.price)}</span></div>
      <div class="row"><span>Prazo</span><span>${escapeHTML(formatarPrazo(p.deadline_days))}</span></div>
    `;

    document.getElementById('confirmModal').classList.add('active');
  }

  function closeConfirmModal() {
    document.getElementById('confirmModal').classList.remove('active');
    proposalToAccept = null;
  }

  /* ============================================
     ACEITAR PROPOSTA
     ============================================ */
  async function aceitarProposta(supabase, proposalId) {
    if (actionInProgress) return;
    actionInProgress = true;

    const btn = document.getElementById('confirmAcceptBtn');
    const originalText = btn.textContent;
    btn.textContent = 'Aceitando...';
    btn.disabled = true;

    try {
      const proposal = proposalsCache.find(x => x.id === proposalId);
      if (!proposal) throw new Error('Proposta não encontrada.');

      /* 1. Proposta aceita */
      const { error: errAccept } = await supabase
        .from('proposals')
        .update({ status: 'ACEITA' })
        .eq('id', proposalId);

      if (errAccept) throw errAccept;

      /* 2. Recusar as outras */
      const otherIds = proposalsCache
        .filter(x => x.id !== proposalId)
        .map(x => x.id);

      if (otherIds.length > 0) {
        await supabase
          .from('proposals')
          .update({ status: 'RECUSADA' })
          .in('id', otherIds);
      }

      /* 3. Atualizar demanda */
      await supabase
        .from('demands')
        .update({ status: 'EM_ANDAMENTO' })
        .eq('id', currentDemandId);

      /* 4. Criar contrato */
      const finalPrice = parseFloat(proposal.price);

      const { data: contractData, error: errContract } = await supabase
        .from('contracts')
        .insert({
          demand_id: currentDemandId,
          proposal_id: proposalId,
          status: 'aguardando_pagamento',
          final_price: finalPrice,
          created_at: new Date().toISOString()
        })
        .select()
        .single();

      if (errContract) throw errContract;

      mostrarToast('Proposta aceita. Redirecionando para o pagamento...', 'success');
      closeConfirmModal();

      setTimeout(() => {
        window.location.href = `pagamento.html?contract_id=${contractData.id}`;
      }, 900);

    } catch (err) {
      console.error('Erro ao aceitar proposta:', err);
      mostrarToast('Erro ao aceitar: ' + err.message, 'error');
      btn.textContent = originalText;
      btn.disabled = false;
      actionInProgress = false;
    }
  }

  /* ============================================
     RECUSAR PROPOSTA
     ============================================ */
  async function recusarProposta(proposalId) {
    if (!confirm('Tem certeza que deseja recusar esta proposta?')) return;

    const supabase = window.supabaseClient;
    if (!supabase) return;

    try {
      const { error } = await supabase
        .from('proposals')
        .update({ status: 'RECUSADA' })
        .eq('id', proposalId);

      if (error) throw error;

      mostrarToast('Proposta recusada.', 'success');
      await carregarPropostas(supabase);

    } catch (err) {
      console.error('Erro ao recusar proposta:', err);
      mostrarToast('Erro ao recusar: ' + err.message, 'error');
    }
  }

  /* ============================================
     REALTIME
     ============================================ */
  function configurarRealtime(supabase) {
    supabase
      .channel('detalhe-demanda-cliente-realtime')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'proposals', filter: `demand_id=eq.${currentDemandId}` },
        () => carregarPropostas(supabase)
      )
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'contracts', filter: `demand_id=eq.${currentDemandId}` },
        () => carregarContratoAceito(supabase)
      )
      .subscribe();
  }

  init();
</script>
</body>
</html>
